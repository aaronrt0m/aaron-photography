<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Aaron Reji Thomas | Photography </title>


    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="img/optimized/portfolio/christmas_bg.webp" fetchpriority="high">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <header class="homeheader">  
        
            <div class="h1container">
                <h1 id="homeh1"> Aaron  Reji Thomas </h1>
                <p class="hero-subtitle">Nature · Wildlife · Small Moments</p>
            </div>
    </header>
    <section>
        <div class="title_lines">
            <h2 class="scroll-reveal from-left">PORTFOLIO</h2>
            <p class="scroll-reveal from-right">Wildlife, nature &amp; the quiet moments in between</p>
        </div>
        <section class="portfolio-section" aria-labelledby="birds-heading">
            <h3 id="birds-heading" class="portfolio-section-title scroll-reveal from-left">Wildlife</h3>
            <div class="portfoliocontainer">
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/8.3.HausSparrow1_EDIT2_v2.polarr.co_or_color.io.webp" loading="lazy" decoding="async" alt="A sparrow perched among green leaves against a blue sky">
                    <figcaption>House Sparrow among the leaves</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/brahminy-white-eagle-2.webp" loading="lazy" decoding="async" alt="A brahminy kite">
                    <figcaption>Sharp Glimpse of the Brahminy Kite</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/IMG_0432.webp" loading="lazy" decoding="async" alt="A small bird perched on a garden wall beneath leafy branches">
                    <figcaption>Jungle Babbler looking for his friends</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/sparklingdrongo.webp" loading="lazy" decoding="async" alt="A dark bird perched on a branch against the sky">
                    <figcaption>Sparkling star in the treetops</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/parrot2_mosh_edit.webp" loading="lazy" decoding="async" alt="A green parrot among bright leaves and flowers">
                    <figcaption>Green parrot among the blossoms</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/guavabird2.webp" loading="lazy" decoding="async" alt="A green bird perched among guava tree branches">
                    <figcaption>Barbet in the guava tree</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/kingfisher-bw.webp" loading="lazy" decoding="async" alt="A kingfisher silhouetted on a palm frond against the sky">
                    <figcaption>Kingfisher against the open sky</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/squirrel1.webp" loading="lazy" decoding="async" alt="A squirrel sitting on a branch among green leaves">
                    <figcaption>Having a meal among the leaves</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/squirrel2.webp" loading="lazy" decoding="async" alt="A squirrel resting along a tree branch">
                    <figcaption>Squirrel resting along a branch</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/mongoose-walk.webp" loading="lazy" decoding="async" alt="A mongoose walking along a low stone wall in front of banana leaves">
                    <figcaption>A mongoose on the garden wall</figcaption>
                </figure>
                <figure class="portfolioimage pigeon-feature">
                    <img src="img/optimized/portfolio/pigeon-baby-bw.webp" loading="lazy" decoding="async" alt="A close-up portrait of a young pigeon">
                    <figcaption>Soft young pigeon</figcaption>
                </figure>
            </div>
        </section>
        <section class="portfolio-section" aria-labelledby="flowers-heading">
            <h3 id="flowers-heading" class="portfolio-section-title scroll-reveal from-left">Flowers &amp; Gardens</h3>
            <div class="portfoliocontainer">
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/gulmohar.webp" loading="lazy" decoding="async" alt="Red gulmohar blossoms spread across a flowering tree">
                    <figcaption>Gulmohar in bloom</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/20241129220528_IMG_1169.webp" loading="lazy" decoding="async" alt="White and pink bougainvillea spilling over a garden wall">
                    <figcaption>Bougainvillea along the wall</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/20241129220547_IMG_1170.webp" loading="lazy" decoding="async" alt="Close view of white flowers among deep green leaves">
                    <figcaption>White petals in the sunlight</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/flower1-edit.webp" loading="lazy" decoding="async" alt="A red hibiscus flower among green leaves">
                    <figcaption>Red hibiscus in the garden</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/flower2.webp" loading="lazy" decoding="async" alt="A pink hibiscus flower in soft light">
                    <figcaption>Pink hibiscus after the rain</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/flower3.webp" loading="lazy" decoding="async" alt="Bright magenta bougainvillea flowers against green leaves">
                    <figcaption>Bound Bougainvillea</figcaption>
                </figure>
                <figure class="portfolioimage flower-feature">
                    <img src="img/optimized/portfolio/flower-wall.webp" loading="lazy" decoding="async" alt="A wall covered with clusters of white bougainvillea">
                    <figcaption>A wall dressed in white blooms</figcaption>
                </figure>
            </div>
        </section>
        <section class="portfolio-section" aria-labelledby="landscape-heading">
            <h3 id="landscape-heading" class="portfolio-section-title scroll-reveal from-right">Coasts &amp; Ponds</h3>
            <div class="portfoliocontainer coast-gallery">
                <figure class="portfolioimage coast-cliffs">
                    <img src="img/optimized/portfolio/20240921001942_IMG_1114.webp" loading="lazy" decoding="async" alt="A misty coastline with steep green cliffs">
                    <figcaption>Cliffs disappearing into the mist</figcaption>
                </figure>
                <figure class="portfolioimage coast-patterns">
                    <img src="img/optimized/portfolio/dhofar_waterfall-2.webp" loading="lazy" decoding="async" alt="waterfalls on a small hill">
                    <figcaption>The elixir of the mountains</figcaption>
                </figure>
                <figure class="portfolioimage coast-waves">
                    <img src="img/optimized/portfolio/20240921005437_IMG_1134.webp" loading="lazy" decoding="async" alt="Waves breaking along a green coastal hillside">
                    <figcaption>Where the waves meet the shore</figcaption>
                </figure>
                <figure class="portfolioimage coast-pool">
                    <img src="img/optimized/portfolio/good_photo3.webp" loading="lazy" decoding="async" alt="A shaded green pool beneath overhanging trees">
                    <figcaption>A still pool beneath the mountains</figcaption>
                </figure>
                <figure class="portfolioimage coast-bridge">
                    <img src="img/optimized/portfolio/kayamkulam bridge.webp" loading="lazy" decoding="async" alt="A red arched bridge spanning the water">
                    <figcaption>Kayamkulam Bridge across the water</figcaption>
                </figure>
            </div>
        </section>
        <section class="portfolio-section" aria-labelledby="sky-heading">
            <h3 id="sky-heading" class="portfolio-section-title scroll-reveal from-left">The Skies</h3>
            <div class="portfoliocontainer sky-gallery">
                <figure class="portfolioimage sky-moon">
                    <img src="img/optimized/skyphoto_E.webp" loading="lazy" decoding="async" alt="The moon above rooftops beneath a pink and blue evening sky">
                    <figcaption>Moonrise over the rooftops</figcaption>
                </figure>
                <figure class="portfolioimage sky-last-light">
                    <img src="img/optimized/portfolio/December21_sunrise_photo.webp" loading="lazy" decoding="async" alt="The sun setting beside a waterside building">
                    <figcaption>Last light by the road</figcaption>
                </figure>
                <figure class="portfolioimage sky-clouds">
                    <img src="img/optimized/portfolio/evening sky photo before easter.webp" loading="lazy" decoding="async" alt="Warm evening clouds above palm trees">
                    <figcaption>Evening clouds over the palms</figcaption>
                </figure>
                <figure class="portfolioimage sky-growing">
                    <img src="img/optimized/portfolio/campus-tree-sky.webp" loading="lazy" decoding="async" alt="A bird perched on a palm silhouette against a pale sky">
                    <figcaption>Growing into the sky</figcaption>
                </figure>
                <figure class="portfolioimage sky-sunset">
                    <img src="img/optimized/portfolio/Pink Sunset.webp" loading="lazy" decoding="async" alt="pink sunset by the garden">
                    <figcaption>Pink sunset by the garden</figcaption>
                </figure>
            </div>
        </section>
        <section class="portfolio-section" aria-labelledby="festive-heading">
            <h3 id="festive-heading" class="portfolio-section-title scroll-reveal from-right">Festive Lights</h3>
            <div class="portfoliocontainer">
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/christmas_bell_edited.webp" loading="lazy" decoding="async" alt="A red bell ornament glowing among colorful Christmas lights">
                    <figcaption>A bell among the Christmas lights</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/christmas_lantern_edited.webp" loading="lazy" decoding="async" alt="A candle glowing inside a decorative lantern">
                    <figcaption>Lantern light in the evening</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/christmas-star.webp" loading="lazy" decoding="async" alt="A glowing star ornament among festive lights">
                    <figcaption>A star lit for the season</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/firework1.webp" loading="lazy" decoding="async" alt="Fireworks rising above a town at night">
                    <figcaption>Fireworks over the rooftops</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/firework2.webp" loading="lazy" decoding="async" alt="A bright firework burst scattering sparks across the night sky">
                    <figcaption>Night sky filled with sparks</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/firework3.webp" loading="lazy" decoding="async" alt="A red firework blooming through a smoky night sky">
                    <figcaption>A burst of light through the smoke</figcaption>
                </figure>
            </div>
        </section>
        <section class="portfolio-section" aria-labelledby="still-life-heading">
            <h3 id="still-life-heading" class="portfolio-section-title scroll-reveal from-left">Still Life</h3>
            <div class="portfoliocontainer">
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/watch1.webp" loading="lazy" decoding="async" alt="A silver chronograph wristwatch photographed against a dark surface">
                    <figcaption>Chronograph in low light</figcaption>
                </figure>
                <figure class="portfolioimage">
                    <img src="img/optimized/portfolio/watch2.webp" loading="lazy" decoding="async" alt="A silver chronograph watch at an angle on a dark surface">
                    <figcaption>Side of the watch face</figcaption>
                </figure>
            </div>
        </section>
    </section>
    <dialog class="lightbox" aria-label="Photo viewer">
        <button class="lightbox-close" type="button" aria-label="Close photo viewer">&times;</button>
        <button class="lightbox-previous" type="button" aria-label="Previous photo">&lsaquo;</button>
        <figure class="lightbox-content">
            <img class="lightbox-image" alt="">
            <figcaption class="lightbox-caption"></figcaption>
        </figure>
        <button class="lightbox-next" type="button" aria-label="Next photo">&rsaquo;</button>
        <p class="lightbox-count" aria-live="polite"></p>
    </dialog>
    <div class="copyright home-copyright scroll-reveal">© Aaron Reji Thomas Photography, All Rights Reserved</div>
    <footer class="social-footer">
        <a class="social-button" href="https://www.instagram.com/aaron._.mp4/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <img src="img/instagram-brands-solid.png" alt="">
        </a>
        <a class="social-button" href="https://www.linkedin.com/in/aaron-reji-thomas-8154b4428/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <img src="img/linkedin-brands-solid.png" alt="">
        </a>
    </footer>

    <script src="js/lightbox.js"></script>
    <script>
        document.addEventListener('contextmenu', function (event) {
            event.preventDefault();
        });
    </script>
